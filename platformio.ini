; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Credentials live in include/secrets.h (git-ignored) - copy include/secrets.h.example to create it.
;
; Environments:
;   nodemcu-32s      - upload over USB.  Use this for the very first flash (the board needs OTA-capable firmware
;                      on it before it can be updated over the air) and for recovery.
;   nodemcu-32s-ota  - upload over WiFi to <DEVICE_NAME>.local.  Use this day to day.
;   native           - unit tests for the door logic, run on your computer:  pio test -e native
; Pick the environment in the VS Code status bar, or e.g.: pio run -e nodemcu-32s-ota -t upload

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps =
	adafruit/Adafruit SH110X@^2.1.14
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
monitor_raw = yes

[env:nodemcu-32s-ota]
extends = env:nodemcu-32s
upload_protocol = espota
; Must match DEVICE_NAME (Definitions.h, or the SD card's settings.txt if it overrides it) followed by .local
; If mDNS ever misbehaves on your network, the device's IP address works here too.
upload_port = Gliderol2MQTT.local
; Passes OTA_PASSWORD from include/secrets.h to the uploader
extra_scripts = post:scripts/ota_auth.py

[env:native]
; Host-side unit tests.  Only the hardware-free code in lib/DoorLogic is built.
platform = native
test_framework = unity
build_flags = -std=c++17
