; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two environments, identical firmware, different upload method:
;   nodemcu-32s      - upload over USB.  Use this for the very first flash (the board needs OTA-capable firmware
;                      on it before it can be updated over the air) and for recovery.
;   nodemcu-32s-ota  - upload over WiFi to <DEVICE_NAME>.local.  Use this day to day.
; Pick the environment in the VS Code status bar, or: pio run -e nodemcu-32s-ota -t upload

[platformio]
default_envs = nodemcu-32s
; Private settings (credentials).  Copy private.ini.example to private.ini and fill it in.
; private.ini is deliberately the ONLY source: if it is missing the build fails, rather than
; quietly producing firmware full of placeholder credentials.
extra_configs =
	private.ini

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps =
	adafruit/Adafruit SH110X@^2.1.14
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
monitor_raw = yes

; Inject the private details into the code globally
build_flags =
	-D WIFI_SSID=${private.wifi_ssid}
	-D WIFI_PASSWORD=${private.wifi_password}
	-D MQTT_BROKER=${private.mqtt_broker}
	-D MQTT_PORT=${private.mqtt_port}
	-D MQTT_USERNAME=${private.mqtt_username}
	-D MQTT_PASSWORD=${private.mqtt_password}
	-D OTA_PASSWORD=${private.ota_password}

[env:nodemcu-32s-ota]
extends = env:nodemcu-32s
upload_protocol = espota
; Must match DEVICE_NAME (Definitions.h, or the SD card's settings.txt if it overrides it) followed by .local
; If mDNS ever misbehaves on your network, the device's IP address works here too.
upload_port = Gliderol2MQTT.local
upload_flags =
	--auth=${private.ota_password}
