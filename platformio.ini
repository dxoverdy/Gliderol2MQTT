; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; Tell PlatformIO to look for private configurations
extra_configs = 
	private.ini.example
	private.ini

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps = 
	adafruit/Adafruit SH110X@^2.1.14
	knolleary/PubSubClient@^2.8
monitor_speed = 115200
monitor_raw = yes

; Inject the private WIFI details into the code globally
build_flags =
	-D WIFI_SSID=${private.wifi_ssid}
	-D WIFI_PASSWORD=${private.wifi_password}
	-D MQTT_BROKER=${private.mqtt_broker}
	-D MQTT_PORT=${private.mqtt_port}
	-D MQTT_USERNAME=${private.mqtt_username}
	-D MQTT_PASSWORD=${private.mqtt_password}